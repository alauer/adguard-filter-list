# This is a basic workflow that is manually triggered

name: Compile List workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *' # Runs every day at 6:30 PM UTC

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and Run in Dev Container
        uses: devcontainers/ci@v0.3
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_EMAIL: ${{ github.actor }}@users.noreply.github.com
        with:
          env: |
            GITHUB_TOKEN
            GITHUB_USER
            GITHUB_EMAIL
          runCmd: |
            git config user.name "${{ env.GITHUB_USER }}"
            git config user.email "${{ env.GITHUB_EMAIL }}"
            git config --global url."https://x-access-token:${{ env.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
            ./compile-hostlist
      - uses: actions/upload-artifact@v4
        id: artifact-upload-step
        with:
          name: blocklist
          path: blocklist
  upload:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Use output from previous job
        uses: actions/download-artifact@v6
        with:
          name: blocklist
      - name: Setup AWS Access
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Sync files to S3
        run: |
          aws s3 cp ./blocklist s3://${{ vars.AWS_BUCKET_NAME }}
