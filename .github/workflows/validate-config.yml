name: Validate hostlist-compiler-config

on:
  pull_request:
    paths:
      - 'hostlist-compiler-config.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JSON syntax
        id: jsonlint
        run: |
          python - <<'PY'
import json,sys
path='hostlist-compiler-config.json'
try:
    with open(path,'r',encoding='utf-8') as f:
        data=json.load(f)
except Exception as e:
    print(f'ERROR: invalid JSON in {path}: {e}')
    sys.exit(1)
print('JSON syntax: OK')
PY

      - name: Basic schema checks
        run: |
          python - <<'PY'
import sys,json
path='hostlist-compiler-config.json'
data=json.load(open(path,encoding='utf-8'))

errors=[]
if not isinstance(data,dict):
    errors.append('Top-level JSON must be an object')
if 'sources' not in data:
    errors.append("Missing required top-level key: 'sources'")
else:
    if not isinstance(data['sources'],list):
        errors.append("'sources' must be an array")
    else:
        for i,s in enumerate(data['sources']):
            if not isinstance(s,dict):
                errors.append(f'sources[{i}] must be an object')
                continue
            for key in ('name','source','type','transformations'):
                if key not in s:
                    errors.append(f"sources[{i}] missing required key: {key}")
            if 'transformations' in s and not isinstance(s['transformations'],list):
                errors.append(f"sources[{i}].transformations must be an array")

if errors:
    print('Schema validation failed:')
    for e in errors:
        print(' -',e)
    sys.exit(1)
print('Basic schema: OK')
PY
